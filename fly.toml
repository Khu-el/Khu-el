# Fly.io app config for the NTE backend.
#
# This app is live: `excellencedistrict-api`, org "Christopher Ransom" (personal), region iad.
# The `nte_data` volume and all secrets (JWT_SECRET, INVITE_CODE, BOOTSTRAP_ADMIN_EMAIL,
# CORS_ORIGINS) are already created/staged on the app directly -- this file only needs to
# match what's live. See docs/continuation/HUMAN_ACTION_REQUIRED.md #5-#6 and
# docs/DOMAIN_NETWORK.md for the remaining DNS + GitHub Pages steps.

app = "excellencedistrict-api"
primary_region = "iad"

[build]
  dockerfile = "server/Dockerfile"

[env]
  PORT = "4000"
  NTE_DATA_DIR = "/data"
  NTE_UPLOADS_DIR = "/data/uploads"
  # One proxy (Fly's edge) sits in front; the sign-in rate limits key on the
  # client IP it forwards. See server/src/lib/env.ts.
  TRUST_PROXY = "1"

[[mounts]]
  source = "nte_data"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
