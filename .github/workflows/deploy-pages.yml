name: Deploy web apps to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  # deploy-pages looks up this run's artifact through the Actions API. Once a
  # workflow lists its permissions, every unlisted one is none, so it has to be
  # granted here explicitly.
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Set this as a repository Variable (Settings > Secrets and variables >
      # Actions > Variables) once the backend is deployed. The planned value is
      # https://api.excellencedistrict.org -- see docs/DOMAIN_NETWORK.md. Until
      # it is set, the built apps fall back to http://localhost:4000 and will
      # just show "offline".
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs first because its base_path output decides where every app is
      # built to live. This repository is Khu-el/Khu-el, which is a *project*
      # site: GitHub serves it at https://khu-el.github.io/Khu-el/, not at the
      # account root (that is reserved for a repository named khu-el.github.io).
      # The apps used to be built for /deal-architect/ and so on, so the first
      # successful deploy served four blank pages -- every script and stylesheet
      # 404'd. base_path is "/Khu-el" today, and "" once a custom domain is
      # attached in Settings -> Pages, so the builds follow wherever the site is
      # actually served without editing this file.
      - id: pages
        uses: actions/configure-pages@v6

      - name: Build deal-architect
        run: npm run build --workspace=apps/deal-architect
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/deal-architect/

      - name: Build capital-readiness
        run: npm run build --workspace=apps/capital-readiness
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/capital-readiness/

      - name: Build notes-underwriting
        run: npm run build --workspace=apps/notes-underwriting
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/notes-underwriting/

      - name: Build legacy-estate
        run: npm run build --workspace=apps/legacy-estate
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/legacy-estate/

      - name: Assemble _site
        run: |
          set -e
          mkdir -p _site
          cp web/landing/index.html _site/index.html
          cp -r apps/deal-architect/dist _site/deal-architect
          cp -r apps/capital-readiness/dist _site/capital-readiness
          cp -r apps/notes-underwriting/dist _site/notes-underwriting
          cp -r apps/legacy-estate/dist _site/legacy-estate

      # There is no CNAME step. When Pages publishes from a GitHub Actions
      # workflow, GitHub ignores any CNAME file in the artifact (see "Managing a
      # custom domain for your GitHub Pages site" in the GitHub docs), so the
      # step that used to write _site/CNAME from PAGES_CUSTOM_DOMAIN could never
      # attach a domain. Attach it in Settings -> Pages -> Custom domain, after
      # the DNS record resolves -- docs/DOMAIN_NETWORK.md has the order.

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
