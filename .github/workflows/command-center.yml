# Verification for nte-command-center.
#
# The repo's other workflow deploys on push to main and never runs on a pull
# request, so until this file existed nothing checked a PR. That is a problem
# specifically for this project: its guarantees — the lane firewall, the
# zero-network rule, the build freeze, the evidence boundary — are only
# guarantees if something other than a person's memory runs them. CLAUDE.md
# says the firewall scan must pass before commit; this is what makes that
# true rather than aspirational.
#
# Scoped by path: it does not fire on changes elsewhere in the repo, and it
# does not touch the deploy workflow.

name: Command Center

on:
  pull_request:
    paths:
      - 'nte-command-center/**'
      - '.github/workflows/command-center.yml'
  push:
    branches: [main]
    paths:
      - 'nte-command-center/**'
      - '.github/workflows/command-center.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: command-center-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: nte-command-center

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nte-command-center/package-lock.json

      - run: npm ci

      # Each step runs separately rather than through `npm run check`, so a
      # failure names which guarantee broke instead of just "check failed".
      - name: Types
        run: npm run check:types

      - name: Lane firewall
        run: npm run check:lanes

      - name: External origins, source
        run: npm run check:network

      - name: Tests
        run: npm test

      # Also runs check:lanes, check:network and check:bundle on the built
      # output, which is where a dependency can introduce a request that no
      # source scan would see.
      - name: Build and scan the bundle
        run: npm run build

      # seed/network-scan.json is generated by check:network. If a build
      # changes it, the committed copy is stale and module 05 would render a
      # count that is no longer measured.
      - name: Generated files are current
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::A generated file changed during the build. Commit the regenerated file."
            exit 1
          fi
