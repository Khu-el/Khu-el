name: CI

# Runs on every pull request and every push to main. Until this existed,
# nothing verified a change before it reached main -- the Pages workflow only
# ran after merge, and only to deploy.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck (all four apps + server)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build all workspaces
        run: npm run build
